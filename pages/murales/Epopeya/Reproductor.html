<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset='utf-8'>
        <meta http-equiv='X-UA-Compatible' content='IE=edge'>
        <title>Reproductor</title>
        <meta name='viewport' content='width=device-width, initial-scale=1'>
        <link rel='stylesheet' type='text/css' media='screen' href='/assets/css/reproductor.css'>
    </head>

    <body>
        <main>
            <img class="item" src="/Img/01_MuralCompleto.jpg" alt="Musicos">
            
            <div id="MP3" class="MP3 item --MP3-bg">

                <audio id="Audio_Track" src="">
                    <source src="" type="">
                </audio>
                <h2></h2>
                <p></p>
                <div id="Controls_Btn" class="Controls_Btn --Controls-st">
                    
                    <input class="__slider" type="range" step="any" value="0" Id="Progress_Audio">
                    <div class="reproducer">
                        <button class="Previous">
                            <img src="/assets/img/Reproductor/Reproducir SONIDO.png" alt="Previous">
                        </button>
                        
                        <button class="Play-Pause">
                            <img id="PlayPause_Icon"  src="/Elementos/Reproductor/Elements/Reproducir SONIDO.png" alt="Play_Pause">
                        </button>

                        <button class="Next">
                            <img src="/Elementos/Reproductor/Elements/Adelantar SONIDO.png" alt="Next">
                        </button>
                    </div>
                </div>

                <div id="Track_List" class="">
                    <ul id="TrackList_Container" class="ListItems Track_List-bg">
                        <li class="track">Track1</li>
                        <li class="track">Track2</li>
                        <li class="track">Track3</li>
                        
                    </ul>
                </div>
            </div>
        </main>

        <script src='/assets/js/Reproductor.js'></script>
    </body>
</html>
